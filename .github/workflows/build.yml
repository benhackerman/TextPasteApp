name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar como nueva versión (crea un Release con el instalador; la app se actualiza sola)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar
        run: dotnet build TextPasteApp.sln -c Release

      - name: Tests
        run: dotnet test tests/TextPasteApp.Core.Tests -c Release --no-build

      # Un solo .exe que no necesita instalar .NET (sirve en el PC del trabajo sin permisos de admin).
      - name: Publicar exe
        run: >
          dotnet publish src/TextPasteApp/TextPasteApp.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content src/TextPasteApp/TextPasteApp.csproj)
          $v = @($xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\TextPaste.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: TextPasteApp-win-x64
          path: |
            publish/TextPasteApp.exe
            out/*.exe

      - name: Crear Release
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: TextPaste ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/TextPaste-${{ steps.version.outputs.value }}-Setup.exe
            publish/TextPasteApp.exe
